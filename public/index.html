<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registro de Usuario</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 60px auto; }
    input { display: block; width: 100%; margin-bottom: 12px; padding: 8px; }
    button { padding: 10px 16px; cursor: pointer; }
    #mensaje { margin-top: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Crear cuenta</h1>
  <form id="formRegistro">
    <input type="text" id="nombre" placeholder="Nombre completo" required />
    <input type="email" id="email" placeholder="Correo electrónico" required />
    <input type="password" id="password" placeholder="Contraseña" required />
    <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" required />
    <button type="submit">Registrarme</button>
  </form>
  <p id="mensaje"></p>

  <script>
    const form = document.getElementById('formRegistro');
    const mensaje = document.getElementById('mensaje');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      mensaje.textContent = 'Enviando...';

      const nombre = document.getElementById('nombre').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value; 
      const passwordValid = password.length >= 8;
      
      const passwordsEqual = password === confirmPassword;
      
      if (!passwordsEqual) { 
        mensaje.style.color = 'red'; 
        mensaje.textContent = 'Las contraseñas no coinciden'; 
        return; 
      }
      
       if (!passwordValid) {
        mensaje.style.color = 'red';
        mensaje.textContent = 'La contraseña debe tener al menos 8 caracteres';
        return;
      }

      try {
        const res = await fetch('/api/registro', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, email, password }),
        });
        const data = await res.json();

        if (res.ok) {
          mensaje.style.color = 'green';
          mensaje.textContent = data.mensaje;
          form.reset();
        } else {
          mensaje.style.color = 'red';
          mensaje.textContent = data.error;
        }
      } catch (err) {
        mensaje.style.color = 'red';
        mensaje.textContent = 'Error de conexión con el servidor';
      }
    });
  </script>
</body>
</html>
